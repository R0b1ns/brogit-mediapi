{% if backend.usb.available %}
<script src="{{ url_for('static', filename='usb.js') }}"></script>
{% endif %}

<h5>USB</h5>

<ul class="list-group mb-2">
    <li class="list-group-item">
        <div class="form-check-reverse form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="settings-ethernet-ip-dhcp" autocomplete="off" checked {% if not backend.usb.available %}disabled{% endif %}>
            <label class="form-check-label w-100 text-start" for="settings-ethernet-ip-dhcp">Create Network Share for USB Drives</label>
        </div>
    </li>
</ul>

<h6>Defaults</h6>

<ul class="list-group mb-2">
    <li class="list-group-item">
        <div class="form-check-reverse form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="settings-usb-audio" autocomplete="off">
            <label class="form-check-label w-100 text-start" for="settings-usb-audio">Play audio when connected/disconnected</label>
        </div>
    </li>
    <li class="list-group-item">
        <div class="form-check-reverse form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="settings-usb-protect-share" autocomplete="off">
            <label class="form-check-label w-100 text-start" for="settings-usb-protect-share">Protect Network Share</label>
        </div>
    </li>
    <li class="list-group-item">
        <div class="row">
            <div class="col-sm-6 col-md-9">
                <label for="settings-network-netmask" class="list-group-item-mod">Username</label>
            </div>
            <div class="col-sm-6 col-md-3">
                <input class="form-control form-control-sm" type="text" id="settings-network-netmask" autocomplete="off" placeholder="usb" disabled>
            </div>
        </div>
    </li>
    <li class="list-group-item">
        <div class="row">
            <div class="col-sm-6 col-md-9">
                <label for="settings-network-gateway" class="list-group-item-mod">Password</label>
            </div>
            <div class="col-sm-6 col-md-3">
                <input class="form-control form-control-sm" type="text" id="settings-network-gateway" autocomplete="off" placeholder="share-password" disabled>
            </div>
        </div>
    </li>
</ul>

<h6>USB Ports</h6>
<!--

    - Protected share?

<h6>Active Network Shares</h6>

{% if usb_devices %}
{% for usb_device in usb_devices %}
    <li>{{ usb_device }}</li>
{% endfor %}
{% endif %}

<ul class="list-group mb-2">
    <li class="list-group-item">
        <div class="form-check-reverse form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="settings-usb-device-1" autocomplete="off" checked>
            <label class="form-check-label w-100 text-start" for="settings-usb-device-1">USB0 <small class="text-muted"><i class="bi bi-person-lock"></i> <i class="bi bi-volume-mute-fill"></i> <a href="#">Configure</a></small></label>
        </div>
    </li>
    <li class="list-group-item">
        <div class="form-check-reverse form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="settings-usb-device-2" autocomplete="off" checked>
            <label class="form-check-label w-100 text-start" for="settings-usb-device-2">USB1</label>
        </div>
    </li>
</ul>
